<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F7F6F3">
  <title>接谜 · 两人一起答对</title>
  <meta name="description" content="各看一段，主动交棒，独立答题。创建两人房间，邀请好友一起完成七局接谜。">
  <meta property="og:title" content="接谜｜各看一段，一起答对">
  <meta property="og:description" content="来做我的搭档！点击房间邀请链接即可加入，一起完成七局接谜。">
  <meta property="og:image" content="https://test-324881-11-1502012345.sh.run.tcloudbase.com/share-card.png">
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
</head>
<body>
  <main aria-label="两人答题接力游戏">
    <aside id="connection-panel" hidden aria-label="联机连接">
      <p id="connection-message" role="status"></p>
      <button id="configure-server" type="button">设置联机服务器</button>
      <a id="home-link" href="https://cyj-hashtag.github.io/">返回个人主页</a>
    </aside>
    <div class="game-shell">
      <canvas id="game" aria-label="答题接力游戏画面" width="375" height="812"></canvas>
      <div id="controls" aria-label="游戏操作"></div>
      <output id="game-status" class="sr-only" aria-live="polite" aria-label="游戏状态"></output>
    </div>
  </main>
  <dialog id="input-dialog">
    <form>
      <label id="input-label" for="input-value">填写答案</label>
      <input id="input-value" autocomplete="off" maxlength="100">
      <div class="dialog-actions">
        <button id="input-cancel" type="button">取消</button>
        <button type="submit">确定</button>
      </div>
    </form>
  </dialog>
  <dialog id="share-dialog" aria-labelledby="share-title">
    <h2 id="share-title">微信分享房间</h2>
    <p id="share-help"></p>
    <label class="share-link-label" for="share-link">房间邀请链接</label>
    <input id="share-link" readonly>
    <div class="dialog-actions">
      <button id="share-copy" type="button">复制房间链接</button>
      <button id="share-close" type="button">关闭</button>
    </div>
    <p id="share-feedback" role="status"></p>
  </dialog>
  <script src="./app.js" defer></script>
</body>
</html>
